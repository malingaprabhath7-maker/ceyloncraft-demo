<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a3320"/><stop offset="1" stop-color="#22140c"/></linearGradient>
  <radialGradient id="glow" cx="200" cy="96" r="130" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffb347" stop-opacity=".55"/><stop offset=".45" stop-color="#e07a2e" stop-opacity=".18"/><stop offset="1" stop-color="#e07a2e" stop-opacity="0"/></radialGradient>
  <radialGradient id="body" cx="105" cy="140" r="110" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#e88a55"/><stop offset=".45" stop-color="#c25a2c"/><stop offset="1" stop-color="#6e2a12"/></radialGradient>
  <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3a874"/><stop offset="1" stop-color="#b9532a"/></linearGradient>
  <radialGradient id="oil" cx="128" cy="134" r="70" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffcf6b"/><stop offset=".6" stop-color="#b97418"/><stop offset="1" stop-color="#5c3208"/></radialGradient>
  <linearGradient id="base" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7a2f14"/><stop offset=".4" stop-color="#c8642f"/><stop offset="1" stop-color="#5e230e"/></linearGradient>
  <linearGradient id="flameO" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#e2501e"/><stop offset=".5" stop-color="#ff9b2f"/><stop offset="1" stop-color="#ffd25e"/></linearGradient>
  <linearGradient id="flameI" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffe9a8"/><stop offset="1" stop-color="#fffdf3"/></linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="blur2"><feGaussianBlur stdDeviation="2"/></filter>
</defs>
<rect width="256" height="256" rx="60" fill="url(#bg)"/>
<rect x="3" y="3" width="250" height="250" rx="57" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="2"/>
<rect width="256" height="256" rx="60" fill="url(#glow)"/>
<g transform="translate(-4 -4) scale(.96)">
<!-- shadow -->
<ellipse cx="128" cy="214" rx="66" ry="10" fill="#000" opacity=".45" filter="url(#soft)"/>
<!-- foot -->
<path d="M100 178h56l8 30a6 6 0 0 1-6 7H98a6 6 0 0 1-6-7Z" fill="url(#base)"/>
<ellipse cx="128" cy="178" rx="28" ry="5" fill="#4a1b0a" opacity=".6"/>
<!-- bowl -->
<path d="M44 134c0 30 38 50 84 50s84-20 84-50Z" fill="url(#body)"/>
<!-- carved band -->
<path d="M58 154c20 12 46 17 70 17s50-5 70-17" fill="none" stroke="#5c210c" stroke-width="3" opacity=".55"/>
<g fill="#5c210c" opacity=".7"><circle cx="76" cy="163" r="3.6"/><circle cx="96" cy="169" r="3.6"/><circle cx="117" cy="172" r="3.6"/><circle cx="139" cy="172" r="3.6"/><circle cx="160" cy="169" r="3.6"/><circle cx="180" cy="163" r="3.6"/></g>
<g fill="#f7b98c" opacity=".55"><circle cx="76" cy="162" r="1.4"/><circle cx="96" cy="168" r="1.4"/><circle cx="117" cy="171" r="1.4"/><circle cx="139" cy="171" r="1.4"/><circle cx="160" cy="168" r="1.4"/><circle cx="180" cy="162" r="1.4"/></g>
<!-- rim + oil -->
<ellipse cx="128" cy="134" rx="84" ry="17" fill="url(#rim)"/>
<ellipse cx="128" cy="134" rx="74" ry="12" fill="url(#oil)"/>
<!-- spout (pinched lip) -->
<path d="M190 126c12-4 26-6 36-2 5 2 4 7-1 9-10 3-22 9-34 18Z" fill="url(#body)"/>
<path d="M192 127c11-3 22-4 31-2 3 1 2 4-1 5-9 2-19 5-29 9Z" fill="url(#oil)" opacity=".85"/>
<path d="M194 126c10-3 21-4 30-2" fill="none" stroke="#f6b386" stroke-width="2" stroke-linecap="round" opacity=".8"/>
<!-- highlight on bowl -->
<path d="M62 146c10 16 30 25 52 28" fill="none" stroke="url(#sheen)" stroke-width="7" stroke-linecap="round" opacity=".6"/>
<!-- wick -->
<path d="M216 127c1-4 1-7 0-11" stroke="#3b220f" stroke-width="4" stroke-linecap="round"/>
<!-- flame glow -->
<ellipse cx="216" cy="92" rx="18" ry="26" fill="#ffb347" opacity=".7" filter="url(#soft)"/>
<path d="M216 56c10 14 16 25 16 36a16 16 0 0 1-32 0c0-11 6-22 16-36Z" fill="url(#flameO)"/>
<path d="M216 76c5 8 8 13 8 19a8 8 0 0 1-16 0c0-6 3-11 8-19Z" fill="url(#flameI)"/>
<!-- reflection of flame on oil -->
<ellipse cx="160" cy="133" rx="20" ry="3.5" fill="#fff4c9" opacity=".7" filter="url(#blur2)"/>
</g>
</svg>
